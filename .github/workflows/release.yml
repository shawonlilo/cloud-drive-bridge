name: Release

# Push a version tag (v0.1.0) and this builds installers for Windows,
# macOS, Linux and Debian, the cdb CLI for all three desktops, and an
# experimental Android APK.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Without this, GITHUB_TOKEN is read-only and release create/upload from
# CI fails with 403 (learned on network-diagnostics v0.2.x).
permissions:
  contents: write

jobs:
  quality-gates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: cargo test --release
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Slop scan (aislop, advisory)
        run: |
          npx --yes aislop scan . || true
          echo "aislop is advisory; gitleaks + tests are the hard gates"

  cli:
    needs: quality-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: cdb-linux-x64
          - os: windows-latest
            artifact: cdb-windows-x64
          - os: macos-latest
            artifact: cdb-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI
        run: cargo build --release --bin cdb
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/cdb
            target/release/cdb.exe
      - name: Name the binary per-platform (avoids name collisions)
        shell: bash
        run: |
          if [ -f target/release/cdb.exe ]; then
            cp target/release/cdb.exe "${{ matrix.artifact }}.exe"
          else
            cp target/release/cdb "${{ matrix.artifact }}"
          fi
      - name: Attach the CLI binary to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cloud Drive Bridge ${{ github.ref_name }}
          files: ${{ matrix.artifact }}*
          fail_on_unmatched_files: false

  e2e:
    name: e2e (CLI vs local S3 server)
    needs: quality-gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install moto S3 server
        run: pip install "moto[server]"
      - name: Build cdb
        run: cargo build --release --bin cdb
      - name: End-to-end proof (test/put/ls/get/rename/share/size/rm)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/e2e-minio.sh ./target/release/cdb
