[package]
name = "cloud-drive-bridge"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Cloud Drive Bridge — mount any S3-compatible bucket as a local drive (Tauri shell over cdb-core)."

[lib]
# Mobile builds require a library target (staticlib/cdylib for the
# Android/iOS loaders, rlib for the desktop binary shim).
name = "cloud_drive_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cloud-drive-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cdb-core = { path = "../../core" }

[profile.release]
opt-level = 3
lto = true
strip = true

# The app is its own workspace root: without this, cargo sees the parent
# workspace at the repository root and refuses to build.
[workspace]
