[workspace]
resolver = "2"
members = ["core", "cli", "ffi", "fuse", "windows-native"]
default-members = ["core", "cli", "ffi", "fuse", "windows-native"]
exclude = ["gui-experimental/src-tauri"]
# The experimental Tauri GUI in gui-experimental/ is its own workspace
# and is NOT part of the shipment (CLI-first; see gui-experimental/README.md).
# It consumes the same cdb-core library through a path dependency.

[profile.release]
opt-level = 3
lto = true
